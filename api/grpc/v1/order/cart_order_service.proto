syntax = "proto3";

package github.com.martketplace.vkr.cart.pkg.api.grpc.v1.order;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/martketplace-vkr/cart/pkg/api/grpc/v1/order;order";

service CartOrderService {
  rpc ReserveCheckoutItems(ReserveCheckoutItemsRequest) returns (ReserveCheckoutItemsResponse);
  rpc GetCheckoutReservation(GetCheckoutReservationRequest) returns (GetCheckoutReservationResponse);
  rpc CommitCheckout(CommitCheckoutRequest) returns (CommitCheckoutResponse);
  rpc ReleaseCheckout(ReleaseCheckoutRequest) returns (ReleaseCheckoutResponse);
}

message CheckoutReservation {
  string checkout_id = 1;
  int64 user_id = 2;
  repeated CheckoutCartItem items = 3;
  CheckoutCartTotals totals = 4;
  uint64 cart_version = 5;
  google.protobuf.Timestamp reserved_until = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CheckoutCartItem {
  int64 product_id = 1;
  int64 vendor_id = 2;
  string vendor_name = 3;
  string product_name = 4;
  string image_url = 5;
  uint32 quantity = 6;
  string unit_price = 7;
  string total_price = 8;
}

message CheckoutCartTotals {
  uint32 total_items = 1;
  string subtotal = 2;
  string discount = 3;
  string total = 4;
}

message ReserveCheckoutItemsRequest {
  int64 user_id = 1;
  string checkout_id = 2;
  repeated int64 product_ids = 3;
  uint64 expected_cart_version = 4;
}

message ReserveCheckoutItemsResponse {
  CheckoutReservation reservation = 1;
}

message GetCheckoutReservationRequest {
  int64 user_id = 1;
  string checkout_id = 2;
}

message GetCheckoutReservationResponse {
  CheckoutReservation reservation = 1;
}

message CommitCheckoutRequest {
  int64 user_id = 1;
  string checkout_id = 2;
}

message CommitCheckoutResponse {
  int64 user_id = 1;
  string checkout_id = 2;
  repeated int64 removed_product_ids = 3;
  uint64 cart_version = 4;
  google.protobuf.Timestamp committed_at = 5;
}

message ReleaseCheckoutRequest {
  int64 user_id = 1;
  string checkout_id = 2;
  string reason = 3;
}

message ReleaseCheckoutResponse {
  int64 user_id = 1;
  string checkout_id = 2;
  repeated int64 released_product_ids = 3;
  uint64 cart_version = 4;
  google.protobuf.Timestamp released_at = 5;
}
